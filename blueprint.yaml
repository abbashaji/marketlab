# Market Lab blueprint config. Protected: agents can never modify it.
project: marketlab
main_branch: main
lease_minutes: 60
max_ci_minutes: 45
bottleneck_threshold: 4
critical_lease_minutes: 15
max_cell_files: 8
acceptance_timeout_s: 600
# Written only by the aggregator / verdict workflows, never by cells (spec section 8).
protected_paths:
  - "exp/*/results.yaml"
  - "exp/*/verdict.json"
  - "research/ranking.json"
owners: {}
